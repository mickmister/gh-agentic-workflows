name: Handy mobile dependency benchmark tools
description: Reproduce Handy's Node, pnpm and native platform setup without release credentials
inputs:
  platform:
    description: android or ios
    required: true
runs:
  using: composite
  steps:
    - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1
      with:
        version: 12.5.1
        package_json_file: source/handy/package.json
        run_install: false
    - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
      with:
        node-version: '22'
    - uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3
      if: inputs.platform == 'android'
      with:
        distribution: temurin
        java-version: '17'
    - uses: android-actions/setup-android@9fc6c4e9069bf8d3d10b2204b1fb8f6ef7065407
      if: inputs.platform == 'android'
      with:
        packages: platform-tools
        log-accepted-android-sdk-licenses: 'false'
    - name: Select Handy's Xcode
      if: inputs.platform == 'ios'
      shell: bash
      run: sudo xcode-select --switch /Applications/Xcode_26.6.app/Contents/Developer && xcodebuild -version
