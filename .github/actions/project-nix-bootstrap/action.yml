name: Project Nix cache bootstrap
description: Pinned host tools for project qualification, independent rebuild and fresh import
runs:
  using: composite
  steps:
    - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
      with: { node-version: '22.23.4' }
    - uses: cachix/install-nix-action@3dc140bfc76c49fbd4dd958429132e3746bcb086
      with:
        install_url: https://releases.nixos.org/nix/nix-2.34.9/install
        set_as_trusted_user: false
        enable_kvm: false
        extra_nix_config: |
          experimental-features = nix-command flakes
          accept-flake-config = false
          require-sigs = true
          extra-trusted-public-keys = agentic-development-cache-v1:EemmIz1RxukZhIqcPKeBuwyljsApMZ5qHAHDCNWnSlY=
    - run: npm ci --ignore-scripts --no-audit --no-fund
      working-directory: .github/qrspi-hosted
      shell: bash
