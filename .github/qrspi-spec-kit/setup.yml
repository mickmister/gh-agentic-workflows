schema_version: '1.0'
workflow:
  id: workspace-setup-author
  name: Scoped setup specialist through direct Pi
  version: 0.1.0
steps:
  - id: author
    type: shell
    strict: true
    timeout: 900
    output_format: json
    run: node --experimental-strip-types "$QRSPI_STEP_RUNNER" run-pi
  - id: validate
    type: shell
    strict: true
    timeout: 30
    output_format: json
    run: node --experimental-strip-types "$QRSPI_STEP_RUNNER" validate
