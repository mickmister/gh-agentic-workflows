schema_version: '1.0'
workflow:
  id: qrspi-research
  name: Canonical QRSPI Research to the next human boundary
  version: 0.1.0
steps:
  - id: instructions
    type: shell
    strict: true
    output_format: json
    timeout: 30
    run: node --experimental-strip-types "$QRSPI_STEP_RUNNER" load-prompts phase --phase research --require-approved questions.md --file skills/using-qrspi/SKILL.md --file skills/research/SKILL.md
  - id: research
    type: prompt
    integration: pi
    prompt: 'qrspi-file-prompt:phase'
    capture: true
    capture_max_bytes: 8192
    timeout: 900
  - id: checkpoint
    type: shell
    strict: true
    output_format: json
    timeout: 30
    run: node --experimental-strip-types "$QRSPI_STEP_RUNNER" validate-phase
