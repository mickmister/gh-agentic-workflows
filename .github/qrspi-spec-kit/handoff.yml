schema_version: '1.0'
workflow:
  id: qrspi-handoff
  name: Surface an unavailable downstream capability without inventing a phase
  version: 0.1.0
steps:
  - id: instructions
    type: shell
    strict: true
    output_format: json
    timeout: 30
    run: node --experimental-strip-types "$QRSPI_STEP_RUNNER" load-prompts phase --phase handoff --file skills/using-qrspi/SKILL.md
  - id: handoff
    type: prompt
    integration: pi
    prompt: 'qrspi-file-prompt:phase'
    capture: true
    capture_max_bytes: 8192
    timeout: 600
  - id: checkpoint
    type: shell
    strict: true
    output_format: json
    timeout: 30
    run: node --experimental-strip-types "$QRSPI_STEP_RUNNER" validate-phase
