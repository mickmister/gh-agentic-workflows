name: Source repository agentic entrypoint

on:
  workflow_call:
    secrets:
      AGENT_APP_ID:
        required: true
      AGENT_APP_PRIVATE_KEY:
        required: true
      NUGS_STORAGE_URL:
        required: true

permissions:
  contents: read

jobs:
  route:
    # Protect callers that have not added the same pre-runner form-output guard.
    if: ${{ github.event_name == 'workflow_dispatch' || (github.event_name == 'issue_comment' && !contains(github.event.comment.body, '<!-- github-ultimate:form:') && (startsWith(github.event.comment.body, '/agentic') || startsWith(github.event.comment.body, '/github-ultimate '))) }}
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    outputs:
      route: ${{ steps.route.outputs.route }}
      comment_reference: ${{ steps.route.outputs.comment_reference }}
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          repository: mickmister/gh-agentic-workflows
          ref: vk/46e5-vd-multi-instanc
          persist-credentials: false
      - id: route
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: python3 .github/scripts/workflow-entry.py
  workspace:
    needs: route
    if: ${{ needs.route.outputs.route == 'persistence' }}
    uses: mickmister/gh-agentic-workflows/.github/workflows/nugs-source.yml@vk/46e5-vd-multi-instanc
    secrets:
      AGENT_APP_ID: ${{ secrets.AGENT_APP_ID }}
      AGENT_APP_PRIVATE_KEY: ${{ secrets.AGENT_APP_PRIVATE_KEY }}
      NUGS_STORAGE_URL: ${{ secrets.NUGS_STORAGE_URL }}
  comment:
    needs: route
    if: ${{ needs.route.outputs.route == 'comment' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          repository: mickmister/gh-agentic-workflows
          ref: vk/46e5-vd-multi-instanc
          persist-credentials: false
      - id: dispatch-auth
        uses: actions/create-github-app-token@v2
        with:
          app-id: ${{ secrets.AGENT_APP_ID }}
          private-key: ${{ secrets.AGENT_APP_PRIVATE_KEY }}
          owner: mickmister
          repositories: gh-agentic-workflows
          permission-actions: write
      - name: Dispatch canonical comment reference to the configured Gas City runner
        env:
          GITHUB_DISPATCH_TOKEN: ${{ steps.dispatch-auth.outputs.token }}
          GC_COMMENT_REFERENCE: ${{ needs.route.outputs.comment_reference }}
        run: python3 .github/scripts/dispatch-pr-comment.py
