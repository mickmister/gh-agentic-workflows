name: Reusable native workspace persistence proof

on:
  workflow_call:
    inputs:
      implementation_ref:
        type: string
        required: true
      workspace:
        type: string
        required: true
      collection_id:
        type: string
        required: true
      dolt_commit:
        type: string
        required: true
      expect_issue:
        type: string
        required: true
      expect_previous_run:
        type: string
        default: ''
      worker_mode:
        type: string
        default: success
    secrets:
      NUGS_STORAGE_URL:
        required: true
      NUGS_STORAGE_TOKEN:
        required: true

permissions:
  contents: read

jobs:
  persistence:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    concurrency:
      group: nugs-persistence-${{ inputs.workspace }}
      cancel-in-progress: false
    env:
      NUGS_STORAGE_URL: ${{ secrets.NUGS_STORAGE_URL }}
      NUGS_STORAGE_TOKEN: ${{ secrets.NUGS_STORAGE_TOKEN }}
      NUGS_WORKSPACE: ${{ inputs.workspace }}
      NUGS_COLLECTION_ID: ${{ inputs.collection_id }}
      NUGS_DOLT_COMMIT: ${{ inputs.dolt_commit }}
      NUGS_EXPECT_ISSUE: ${{ inputs.expect_issue }}
      NUGS_EXPECT_PREVIOUS_RUN: ${{ inputs.expect_previous_run }}
      NUGS_WORKER_MODE: ${{ inputs.worker_mode }}
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          repository: mickmister/gh-agentic-workflows
          ref: ${{ inputs.implementation_ref }}
          persist-credentials: false
      - name: Fetch and verify pinned native tools
        run: python3 .github/scripts/nugs-ci.py bootstrap
      - name: Restore exact workspace before work
        id: restore
        run: python3 .github/scripts/nugs-ci.py restore
      - name: Bounded synthetic worker
        id: worker
        continue-on-error: true
        run: python3 .github/scripts/nugs-ci.py worker
      - name: Publish and independently verify after success or ordinary failure
        if: ${{ always() && steps.restore.outcome == 'success' }}
        id: persistence
        env:
          NUGS_WORKER_OUTCOME: ${{ steps.worker.outcome }}
        run: python3 .github/scripts/nugs-ci.py finalize
      - name: Retain URL-free component receipts
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: nugs-persistence-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            ${{ runner.temp }}/nugs-ci-${{ github.run_id }}-${{ github.run_attempt }}/receipt.json
            ${{ runner.temp }}/nugs-ci-${{ github.run_id }}-${{ github.run_attempt }}/toolchain.json
            ${{ runner.temp }}/nugs-ci-${{ github.run_id }}-${{ github.run_attempt }}/restore.json
          if-no-files-found: warn
      - name: Preserve worker and persistence failures independently
        if: always()
        env:
          WORKER_OUTCOME: ${{ steps.worker.outcome }}
          PERSISTENCE_OUTCOME: ${{ steps.persistence.outcome }}
        run: |
          test "$WORKER_OUTCOME" = success
          test "$PERSISTENCE_OUTCOME" = success
