name: QRSPI PoC unit and checkpoint tests
on:
  pull_request:
  push:
    branches: [master]
permissions:
  contents: read
jobs:
  tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: node --test poc/qrspi-slice.test.mjs .github/scripts/qrspi-comment.test.mjs
