name: Self-hosted VM and Compose (on demand)
on:
  workflow_dispatch:
    inputs:
      suite:
        description: Build/test/publish a Proxmox VM, or run only Compose E2E
        type: choice
        options: [vm, compose]
        default: vm
      publish:
        description: Publish the tested VM to private S3
        type: boolean
        default: true
permissions:
  contents: read
jobs:
  native-compose:
    if: inputs.suite == 'compose'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - name: Build pinned services and released native tool image
        working-directory: self-hosting
        run: docker compose --env-file .env.example -f compose.yml build --quiet minio gateway worker-image
      - name: Exercise real Gitea jobs and native thread recovery with a fixture provider
        working-directory: self-hosting
        run: python3 tests/smoke.py
      - name: Verify private S3 publication and stale-write rejection
        run: docker exec agentic-test-gateway-1 python /opt/pilot/tests/storage_pages.py
      - name: Restore coherent state into new volumes
        working-directory: self-hosting
        run: python3 tests/recovery.py
      - name: Remove only this disposable installation
        if: always()
        working-directory: self-hosting
        run: docker compose --env-file .env -f compose.yml -f tests/compose.test.yml down --volumes
  proxmox-vm:
    if: inputs.suite == 'vm'
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - name: Install QEMU and enable hardware virtualization
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends qemu-system-x86 qemu-utils cloud-image-utils
          test -c /dev/kvm
          sudo chmod a+rw /dev/kvm
      - name: Build and preload pinned container images
        working-directory: self-hosting
        run: |
          docker compose --env-file .env.example -f compose.yml build --quiet minio gateway worker-image
          docker compose --env-file .env.example -f compose.yml pull gitea runner caddy
          docker builder prune --all --force
      - name: Build sealed QCOW2 and boot it for guest E2E
        run: node --experimental-strip-types self-hosting/vm/image.ts
      - name: Publish only the tested base disk and checksum manifest
        if: inputs.publish
        env:
          S3_CACHE_URL: ${{ secrets.S3_CACHE_URL }}
          S3_CACHE_REGION: ${{ secrets.S3_CACHE_REGION }}
          S3_CACHE_BUCKET: ${{ secrets.S3_CACHE_BUCKET }}
          S3_CACHE_PREFIX: ${{ secrets.S3_CACHE_PREFIX }}
          S3_CACHE_PATH_STYLE: ${{ secrets.S3_CACHE_PATH_STYLE }}
          S3_CACHE_ACCESS_KEY_ID: ${{ secrets.S3_CACHE_ACCESS_KEY_ID }}
          S3_CACHE_SECRET_ACCESS_KEY: ${{ secrets.S3_CACHE_SECRET_ACCESS_KEY }}
        run: node --experimental-strip-types self-hosting/vm/publish.ts upload
