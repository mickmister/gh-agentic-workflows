name: QRSPI native Gas City checkpoint smoke test
on:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  cook:
    runs-on: ubuntu-latest
    outputs:
      root_id: ${{ steps.cook.outputs.root_id }}
      gate_id: ${{ steps.cook.outputs.gate_id }}
      implement_id: ${{ steps.cook.outputs.implement_id }}
      approval_id: ${{ steps.cook.outputs.approval_id }}
    steps:
      - uses: actions/checkout@v4
      - name: Install prerequisites
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq tmux jq
      - name: Install pinned Gas City, Beads, Dolt
        run: bash poc/scripts/install-gascity.sh
      - name: Initialize city and create real formula-v2 Beads
        id: cook
        run: |
          set -euo pipefail
          export PATH="$RUNNER_TEMP/qrspi-bin:$PATH"
          dolt config --global --add user.name 'QRSPI CI'
          dolt config --global --add user.email 'qrspi-ci@users.noreply.github.com'
          gc init /tmp/qrspi-city
          mkdir -p /tmp/qrspi-city/formulas
          cp poc/formulas/qrspi-slice.toml /tmp/qrspi-city/formulas/
          cd /tmp/qrspi-city
          gc formula show qrspi-slice
          gc formula cook qrspi-slice | tee /tmp/qrspi-cook.txt
          root_id="$(sed -n 's/^Root: //p' /tmp/qrspi-cook.txt | head -1)"
          test -n "$root_id"
          echo "root_id=$root_id" >> "$GITHUB_OUTPUT"
          for stage in goals design tests; do
            step_id="$(sed -n "s/^qrspi-slice\\.$stage -> //p" /tmp/qrspi-cook.txt | head -1)"
            test -n "$step_id"
            gc bd close "$step_id" --reason "Deterministic stage finished before human approval"
          done
          gate_id="$(sed -n "s/^qrspi-slice\\.gate-approval -> //p" /tmp/qrspi-cook.txt | head -1)"
          implement_id="$(sed -n "s/^qrspi-slice\\.implement -> //p" /tmp/qrspi-cook.txt | head -1)"
          test -n "$gate_id" && test -n "$implement_id"
          echo "gate_id=$gate_id" >> "$GITHUB_OUTPUT"
          echo "implement_id=$implement_id" >> "$GITHUB_OUTPUT"
          approval_id="$(sed -n "s/^qrspi-slice\\.approval -> //p" /tmp/qrspi-cook.txt | head -1)"
          test -n "$approval_id"
          echo "approval_id=$approval_id" >> "$GITHUB_OUTPUT"
          gc bd show "$root_id"
          gc bd show "$gate_id"
          gc stop /tmp/qrspi-city
          tar -czf /tmp/qrspi-native-checkpoint.tar.gz -C /tmp qrspi-city
      - uses: actions/upload-artifact@v4
        with:
          name: native-gascity-checkpoint
          path: /tmp/qrspi-native-checkpoint.tar.gz
          retention-days: 7
  restore:
    needs: cook
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install prerequisites
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq tmux jq
      - name: Install pinned Gas City, Beads, Dolt
        run: bash poc/scripts/install-gascity.sh
      - uses: actions/download-artifact@v4
        with:
          name: native-gascity-checkpoint
          path: /tmp
      - name: Restore on fresh runner and inspect original workflow root
        env:
          EXPECTED_ROOT_ID: ${{ needs.cook.outputs.root_id }}
        run: |
          set -euo pipefail
          export PATH="$RUNNER_TEMP/qrspi-bin:$PATH"
          tar -xzf /tmp/qrspi-native-checkpoint.tar.gz -C /tmp
          cd /tmp/qrspi-city
          dolt config --global --add user.name 'QRSPI CI'
          dolt config --global --add user.email 'qrspi-ci@users.noreply.github.com'
          gc start /tmp/qrspi-city
          gc bd show "$EXPECTED_ROOT_ID"
          gate_id="${{ needs.cook.outputs.gate_id }}"
          implement_id="${{ needs.cook.outputs.implement_id }}"
          gc bd show "$gate_id"
          gc bd gate resolve "$gate_id" --reason 'Human approval simulated on fresh runner'
          gc bd show "$gate_id"
          approval_id="${{ needs.cook.outputs.approval_id }}"
          gc bd close "$approval_id" --reason "Approved reviewer decision processed"
          gc bd ready --json | tee /tmp/qrspi-ready.json
          jq -e --arg id "$implement_id" 'any(.[]; .id == $id)' /tmp/qrspi-ready.json
          gc bd show "$implement_id"
          gc formula show qrspi-slice
          echo "Original Gas City root Bead survived independent Actions runner restoration: $EXPECTED_ROOT_ID"
