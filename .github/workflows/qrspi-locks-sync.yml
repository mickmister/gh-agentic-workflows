name: Update compiled gh-aw locks on PoC branch
on:
  push:
    branches: [feat/qrspi-resumable-workflow-poc]
permissions:
  contents: write
jobs:
  compile-and-commit:
    if: github.repository == 'mickmister/gh-agentic-workflows' && github.ref == 'refs/heads/feat/qrspi-resumable-workflow-poc'
    runs-on: ubuntu-latest
    concurrency:
      group: qrspi-compile-branch
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/qrspi-resumable-workflow-poc
          fetch-depth: 0
      - name: Install gh-aw
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh extension install github/gh-aw
      - name: Compile both workflows
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh aw compile .github/workflows/qrspi-start.md
          gh aw compile .github/workflows/qrspi-resume.md
      - name: Commit generated lockfiles
        run: |
          set -euo pipefail
          git add .github/workflows/qrspi-start.lock.yml .github/workflows/qrspi-resume.lock.yml
          if git diff --cached --quiet; then
            echo 'Lockfiles already synchronized'
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'build(gh-aw): commit compiled workflow locks'
          git push origin HEAD:refs/heads/feat/qrspi-resumable-workflow-poc
