name: QRSPI Resume checkpoint dispatch smoke
on:
  push:
    paths:
      - .github/workflows/qrspi-resume-dispatch-smoke.yml
permissions:
  contents: read
  actions: write
jobs:
  dispatch:
    if: github.ref == 'refs/heads/feat/qrspi-resumable-workflow-poc'
    runs-on: ubuntu-latest
    steps:
      - name: Verify checkpoint and dispatch independent Resume run
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          REF: ${{ github.ref_name }}
        shell: bash
        run: |
          set -euo pipefail
          test "$REF" = feat/qrspi-resumable-workflow-poc
          checkpoint="$(gh api "repos/$REPO/contents/pr-smoke/checkpoint.json?ref=memory/qrspi-poc" --jq .content | base64 -d)"
          echo "$checkpoint" | jq -e '.workspace_id=="pr-smoke" and .revision==1 and .status=="awaiting_approval"' >/dev/null
          echo "Checkpoint validated; dispatching Resume in a separate workflow run"
          jq -nc --arg ref "$REF" '{ref:$ref, inputs:{workspace_id:"pr-smoke", revision:"1",decision:"approve"}}' |
            gh api -X POST "repos/$REPO/actions/workflows/qrspi-resume.lock.yml/dispatches" --input -
