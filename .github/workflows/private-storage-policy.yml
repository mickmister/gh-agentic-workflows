name: Private workflow storage policy
on:
  push:
    paths: ['.github/**']
  pull_request:
    paths: ['.github/**']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  policy:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - run: python3 -m unittest discover -s .github/scripts -p test_no_workflow_artifacts.py -v
      - run: python3 -m unittest discover -s .github/scripts -p test_workflow_files.py -v
