name: Selected-model inference and tool streaming

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  inference:
    runs-on: ubuntu-24.04
    timeout-minutes: 6
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - name: Verify exact selected model, medium reasoning, tool round trip and stream
        env:
          INFERENCE_BASE_URL: ${{ secrets.INFERENCE_BASE_URL }}
          INFERENCE_API_KEY: ${{ secrets.INFERENCE_API_KEY }}
          CF_ACCESS_CLIENT_ID: ${{ secrets.CF_ACCESS_CLIENT_ID }}
          CF_ACCESS_CLIENT_SECRET: ${{ secrets.CF_ACCESS_CLIENT_SECRET }}
        run: node .github/scripts/inference-model-smoke.mjs > "$RUNNER_TEMP/inference-model-receipt.json"
      - name: Retain body-free inference receipt
        uses: ./.github/actions/workflow-files
        with:
          name: inference-model-${{ github.run_id }}
          path: ${{ runner.temp }}/inference-model-receipt.json
          if-no-files-found: error
          s3-url: ${{ secrets.S3_CACHE_URL }}
          s3-region: ${{ secrets.S3_CACHE_REGION }}
          s3-bucket: ${{ secrets.S3_CACHE_BUCKET }}
          s3-prefix: ${{ secrets.S3_CACHE_PREFIX }}
          s3-path-style: ${{ secrets.S3_CACHE_PATH_STYLE }}
          s3-access-key-id: ${{ secrets.S3_CACHE_ACCESS_KEY_ID }}
          s3-secret-access-key: ${{ secrets.S3_CACHE_SECRET_ACCESS_KEY }}
          s3-session-token: ${{ secrets.S3_CACHE_SESSION_TOKEN }}
