# Install in mickmister/testopia/.github/workflows/testopia-gascity-worker.yml
# on the DEFAULT branch. gh-aw's safe-output router dispatches this workflow
# in Testopia, and the publisher uses Testopia's own GITHUB_TOKEN.
name: Testopia Gas City worker
on:
  workflow_dispatch:
    inputs:
      workspace_id: {required: true, type: string}
      action: {required: true, type: string}
      formula: {required: true, type: string}
      target_repo: {required: true, type: string}
      pr_number: {required: true, type: string}
      expected_head_sha: {required: true, type: string}
permissions:
  contents: read
jobs:
  execute:
    # A reviewed full SHA is recommended instead of a mutable branch ref.
    uses: mickmister/gh-agentic-workflows/.github/workflows/testopia-gascity-worker.yml@feat/qrspi-resumable-workflow-poc
    permissions:
      contents: read
      actions: read
      pull-requests: read
    with:
      workspace_id: ${{ inputs.workspace_id }}
      action: ${{ inputs.action }}
      formula: ${{ inputs.formula }}
      target_repo: ${{ inputs.target_repo }}
      pr_number: ${{ inputs.pr_number }}
      expected_head_sha: ${{ inputs.expected_head_sha }}
    secrets:
      COPILOT_GITHUB_TOKEN: ${{ secrets.COPILOT_GITHUB_TOKEN }}
  publish:
    needs: execute
    if: ${{ always() }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
      issues: write
      pull-requests: read
    steps:
      - name: Update this PR's agent execution report
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          RESULT: ${{ needs.execute.result }}
          PR_NUMBER: ${{ inputs.pr_number }}
          WORKSPACE_ID: ${{ inputs.workspace_id }}
          EXPECTED_SHA: ${{ inputs.expected_head_sha }}
        shell: bash
        run: |
          set -euo pipefail
          # Report only for this prototype's approved target.
          test "$REPO" = "mickmister/testopia"
          test "$PR_NUMBER" = "3"
          [[ "$EXPECTED_SHA" =~ ^[a-f0-9]{40}$ ]]
          pr="$(gh api "repos/$REPO/pulls/$PR_NUMBER")"
          test "$(jq -r '.number' <<< "$pr")" = "$PR_NUMBER"
          marker="<!-- testopia-agent-run:$GITHUB_RUN_ID -->"
          url="$GITHUB_SERVER_URL/$REPO/actions/runs/$GITHUB_RUN_ID"
          body="$(printf '%s\n' "$marker" "### Gas City / Copilot execution" \
            "- Result: **$RESULT**" \
            "- Workspace: \`$WORKSPACE_ID\`" \
            "- Tested PR head: \`$EXPECTED_SHA\`" \
            "- [View run and evidence]($url)" \
            "" "This report is a run result, not proof that Testopia CI was fixed.")"
          # Update only our exact marker, never another user's comment.
          existing="$(gh api --paginate "repos/$REPO/issues/$PR_NUMBER/comments?per_page=100" \
            --jq ".[] | select(.user.login == \"github-actions[bot]\") | select(.body | contains(\"$marker\")) | .id" | head -1)"
          payload="$(jq -n --arg body "$body" '{body:$body}')"
          if [[ -n "$existing" ]]; then
            gh api -X PATCH "repos/$REPO/issues/comments/$existing" --input - <<< "$payload"
          else
            gh api -X POST "repos/$REPO/issues/$PR_NUMBER/comments" --input - <<< "$payload"
          fi
