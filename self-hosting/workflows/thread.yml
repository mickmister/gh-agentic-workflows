name: Isolated native thread
on:
  workflow_dispatch:
    inputs:
      workspace:
        required: true
        type: string
      thread:
        required: true
        type: string
jobs:
  conversation:
    runs-on: agentic
    # No host execution, job container socket mount, downloads, checkout action,
    # project install or outer model call on the message hot path.
    steps:
      - name: Run addressed thread in native Gas City session
        env:
          PILOT_WORKSPACE: ${{ inputs.workspace }}
          PILOT_THREAD: ${{ inputs.thread }}
          PILOT_WORKER_TOKEN: ${{ secrets.PILOT_WORKER_TOKEN }}
          PILOT_GATEWAY: http://gateway:8080
        run: python /opt/pilot/worker.py
